name: Publish to npm

# Fires on a version tag push (e.g. `v0.5.2`), not on every push to main —
# publishing is a deliberate, explicit step: bump package.json, then
#   git tag v<version> && git push origin v<version>
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json's version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION — refusing to publish a mismatch."
            exit 1
          fi
          echo "Publishing eaves-panel@$PKG_VERSION"

      - name: Sanity-check the source parses
        run: node -c src/eaves.js

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
